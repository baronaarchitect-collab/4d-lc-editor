<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>4D LC Editor — BIM 4D</title>
<style>
  :root{
    --bg:#0e1116; --panel:#161b22; --panel2:#1c2230; --line:#2b3444;
    --txt:#e6edf3; --muted:#8b98a9; --accent:#3b82f6; --accent2:#22c55e;
    --crit:#ef4444; --warn:#f59e0b; --row:#0f1420; --rowsel:#1d3a5f;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;height:100%;font-family:"Segoe UI",Roboto,Arial,sans-serif;background:var(--bg);color:var(--txt);overflow:hidden;font-size:13px;}
  button{font-family:inherit;font-size:12px;background:var(--panel2);color:var(--txt);border:1px solid var(--line);border-radius:6px;padding:6px 10px;cursor:pointer;display:inline-flex;align-items:center;gap:5px;}
  button:hover{border-color:var(--accent);background:#232c3d;}
  button:disabled{opacity:.4;cursor:not-allowed;}
  button.active{background:var(--accent);border-color:var(--accent);color:#fff;}
  input,select{font-family:inherit;background:#0c1017;color:var(--txt);border:1px solid var(--line);border-radius:4px;padding:3px 5px;font-size:12px;}
  input:focus,select:focus{outline:none;border-color:var(--accent);}
  #top{height:46px;display:flex;align-items:center;gap:8px;padding:0 12px;background:var(--panel);border-bottom:1px solid var(--line);flex-shrink:0;}
  #top .logo{font-weight:700;letter-spacing:.5px;color:var(--accent);margin-right:6px;}
  #top .logo b{color:var(--accent2);}
  .sep{width:1px;height:26px;background:var(--line);margin:0 4px;}
  .spacer{flex:1;}
  #main{display:flex;height:calc(100% - 46px);}
  #left{width:640px;min-width:360px;background:var(--panel);border-right:1px solid var(--line);display:flex;flex-direction:column;flex-shrink:0;}
  #dragbar{width:5px;cursor:col-resize;background:var(--line);flex-shrink:0;}
  #dragbar:hover{background:var(--accent);}
  #right{flex:1;position:relative;min-width:0;}
  #viewport{position:absolute;inset:0;}
  canvas{display:block;}

  /* schedule */
  #schedToolbar{display:flex;flex-wrap:wrap;gap:5px;padding:8px;border-bottom:1px solid var(--line);align-items:center;}
  #schedToolbar button{padding:5px 8px;}
  #tableWrap{flex:1;overflow:auto;}
  table.sched{border-collapse:collapse;width:100%;font-size:12px;white-space:nowrap;}
  table.sched th{position:sticky;top:0;background:var(--panel2);border:1px solid var(--line);padding:5px 6px;font-weight:600;color:var(--muted);text-align:left;z-index:2;}
  table.sched td{border:1px solid var(--line);padding:0;}
  table.sched tr{background:var(--row);}
  table.sched tr.sel{background:var(--rowsel);}
  table.sched tr.summary{font-weight:700;background:#121a26;}
  table.sched tr.critical td.namecell{border-left:3px solid var(--crit);}
  table.sched td .cell{padding:4px 6px;min-height:24px;display:flex;align-items:center;gap:4px;}
  table.sched td input{width:100%;border:none;background:transparent;padding:4px 5px;}
  table.sched td input[type=date]{width:120px;color-scheme:dark;}
  table.sched td input[type=number]{width:60px;}
  .nameinput{font-weight:inherit;}
  .indent{display:inline-block;}
  .twist{color:var(--muted);width:12px;display:inline-block;cursor:pointer;user-select:none;}
  .cbadge{font-size:10px;padding:1px 5px;border-radius:8px;background:var(--crit);color:#fff;}
  .swatch{width:11px;height:11px;border-radius:2px;flex-shrink:0;border:1px solid rgba(255,255,255,.25);}
  .elcount{font-size:10px;color:var(--muted);background:#0c1017;border:1px solid var(--line);border-radius:8px;padding:0 5px;cursor:pointer;}
  .elcount:hover{border-color:var(--accent);color:var(--txt);}
  .idcell{color:var(--muted);text-align:center;width:34px;}
  .critcell{text-align:center;}

  /* overlays */
  #rubber{position:absolute;border:1.5px dashed var(--accent);background:rgba(59,130,246,.12);pointer-events:none;display:none;z-index:10;}
  #hud{position:absolute;left:10px;top:10px;background:rgba(12,16,23,.82);border:1px solid var(--line);border-radius:8px;padding:8px 11px;font-size:12px;pointer-events:none;max-width:340px;line-height:1.5;}
  #hud b{color:var(--accent2);}
  #assignBar{position:absolute;left:50%;transform:translateX(-50%);top:10px;background:rgba(20,26,38,.95);border:1px solid var(--accent);border-radius:10px;padding:8px 12px;display:none;align-items:center;gap:10px;z-index:11;box-shadow:0 6px 24px rgba(0,0,0,.5);}
  #assignBar b{color:var(--accent);}
  #loader{position:absolute;inset:0;background:rgba(8,10,14,.85);display:none;align-items:center;justify-content:center;flex-direction:column;gap:14px;z-index:30;}
  #loader .spin{width:42px;height:42px;border:4px solid var(--line);border-top-color:var(--accent);border-radius:50%;animation:sp 1s linear infinite;}
  @keyframes sp{to{transform:rotate(360deg);}}

  /* timeline */
  #timeline{position:absolute;left:12px;right:12px;bottom:12px;background:rgba(18,23,32,.95);border:1px solid var(--line);border-radius:10px;padding:10px 14px;display:flex;align-items:center;gap:12px;z-index:9;}
  #timeline .date{font-weight:700;color:var(--accent2);min-width:110px;}
  #timeSlider{flex:1;}
  #timeline.hidden{display:none;}

  .hint{color:var(--muted);font-size:11px;}
  .empty{padding:30px;color:var(--muted);text-align:center;line-height:1.7;}
  ::-webkit-scrollbar{width:10px;height:10px;}
  ::-webkit-scrollbar-thumb{background:#2b3444;border-radius:5px;}
  ::-webkit-scrollbar-track{background:transparent;}

  /* modal element list */
  #modal{position:fixed;inset:0;background:rgba(0,0,0,.6);display:none;align-items:center;justify-content:center;z-index:50;}
  #modal .box{background:var(--panel);border:1px solid var(--line);border-radius:12px;width:520px;max-height:70vh;display:flex;flex-direction:column;}
  #modal .hd{padding:12px 16px;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;align-items:center;font-weight:600;}
  #modal .bd{overflow:auto;padding:8px 0;}
  #modal .el{padding:6px 16px;display:flex;justify-content:space-between;gap:8px;border-bottom:1px solid #1a212c;}
  #modal .el:hover{background:var(--panel2);}
  #modal .el small{color:var(--muted);}
</style>
</head>
<body>

<div id="top">
  <span class="logo">4D&nbsp;<b>LC</b>&nbsp;Editor</span>
  <button id="btnImport">📂 Importar IFC</button>
  <input type="file" id="fileInput" accept=".ifc" style="display:none">
  <div class="sep"></div>
  <button id="btnSelect" title="Modo selección: arrastra una caja sobre el modelo">▭ Selección</button>
  <button id="btnAssign" disabled title="Asignar elementos seleccionados a la actividad activa">🔗 Asignar a actividad</button>
  <button id="btnClearSel" title="Limpiar selección">✖ Limpiar</button>
  <button id="btnIsolate" title="Aislar / mostrar todo">👁 Aislar</button>
  <div class="sep"></div>
  <button id="btnCPM" title="Calcular ruta crítica (CPM)">⚡ Calcular CPM</button>
  <label class="hint">Inicio proyecto <input type="date" id="projStart"></label>
  <div class="spacer"></div>
  <button id="btn4D" title="Simulación 4D">▶ Simulación 4D</button>
  <button id="btnFit" title="Encuadrar">⤢ Encuadrar</button>
</div>

<div id="main">
  <div id="left">
    <div id="schedToolbar">
      <button id="tAdd" title="Nueva actividad">＋ Actividad</button>
      <button id="tSub" title="Nueva subactividad">＋ Sub</button>
      <div class="sep"></div>
      <button id="tIndent" title="Aumentar sangría (Tab)">⇥ Sangría</button>
      <button id="tOutdent" title="Disminuir sangría (Shift+Tab)">⇤ Anular</button>
      <div class="sep"></div>
      <button id="tUp" title="Subir">▲</button>
      <button id="tDown" title="Bajar">▼</button>
      <button id="tDel" title="Eliminar">🗑</button>
      <div class="spacer"></div>
      <button id="tDemo" title="Cargar cronograma de ejemplo">Ejemplo</button>
    </div>
    <div id="tableWrap"></div>
  </div>
  <div id="dragbar"></div>
  <div id="right">
    <div id="viewport"></div>
    <div id="rubber"></div>
    <div id="hud">
      <div>Elementos: <b id="hEls">0</b> · Seleccionados: <b id="hSel">0</b></div>
      <div class="hint" id="hHint">Importa un IFC para empezar.</div>
    </div>
    <div id="assignBar">
      <span><b id="abCount">0</b> elementos seleccionados</span>
      <span class="hint">→ actividad:</span>
      <b id="abTask">—</b>
      <button id="abAssign">Asignar</button>
    </div>
    <div id="timeline" class="hidden">
      <button id="tlPlay">▶</button>
      <span class="date" id="tlDate">—</span>
      <input type="range" id="timeSlider" min="0" max="100" value="0">
      <span class="hint" id="tlInfo"></span>
      <button id="tlClose">✖</button>
    </div>
    <div id="loader"><div class="spin"></div><div id="loadTxt">Procesando IFC…</div></div>
  </div>
</div>

<div id="modal"><div class="box">
  <div class="hd"><span id="mTitle">Elementos</span><button id="mClose">Cerrar</button></div>
  <div class="bd" id="mBody"></div>
</div></div>

<script type="importmap">
{
  "imports": {
    "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
    "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/",
    "web-ifc": "https://cdn.jsdelivr.net/npm/web-ifc@0.0.57/web-ifc-api.js"
  }
}
</script>

<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
import { IfcAPI } from 'web-ifc';

/* ============================================================= *
 *  ESTADO GLOBAL
 * ============================================================= */
const State = {
  tasks: [],            // {id,name,level,duration,ps,pf,as,af,pred,elements[],color,collapsed}
  seq: 1,
  selectedTaskId: null,
  selectedElements: new Set(),   // expressIDs seleccionados en 3D
  mode4D: false,
  selectMode: false,
};

const PALETTE = ['#3b82f6','#22c55e','#f59e0b','#ef4444','#a855f7','#06b6d4','#ec4899','#84cc16','#f97316','#14b8a6','#eab308','#8b5cf6'];

/* ============================================================= *
 *  THREE.JS  ESCENA
 * ============================================================= */
const viewport = document.getElementById('viewport');
const renderer = new THREE.WebGLRenderer({antialias:true});
renderer.setPixelRatio(Math.min(window.devicePixelRatio,2));
renderer.setSize(viewport.clientWidth, viewport.clientHeight);
viewport.appendChild(renderer.domElement);

const scene = new THREE.Scene();
scene.background = new THREE.Color(0x0e1116);

const camera = new THREE.PerspectiveCamera(55, viewport.clientWidth/viewport.clientHeight, 0.1, 100000);
camera.position.set(30,30,30);

const controls = new OrbitControls(camera, renderer.domElement);
controls.enableDamping = true;
controls.dampingFactor = 0.08;

scene.add(new THREE.AmbientLight(0xffffff,0.75));
const dir = new THREE.DirectionalLight(0xffffff,0.9); dir.position.set(50,80,40); scene.add(dir);
const dir2 = new THREE.DirectionalLight(0xffffff,0.4); dir2.position.set(-40,20,-30); scene.add(dir2);
const grid = new THREE.GridHelper(200,40,0x334155,0x1e293b); scene.add(grid);

// grupo raíz del modelo (Z-up -> Y-up)
const modelRoot = new THREE.Group();
modelRoot.rotation.x = -Math.PI/2;
scene.add(modelRoot);

// registro de elementos: expressID -> {meshes:[], baseColor:THREE.Color, centroid:Vector3, name, type}
const Elements = new Map();

function animate(){
  requestAnimationFrame(animate);
  controls.update();
  renderer.render(scene,camera);
}
animate();

window.addEventListener('resize', onResize);
function onResize(){
  const w = viewport.clientWidth, h = viewport.clientHeight;
  renderer.setSize(w,h);
  camera.aspect = w/h; camera.updateProjectionMatrix();
}

/* ============================================================= *
 *  IFC  IMPORT
 * ============================================================= */
const ifcAPI = new IfcAPI();
let ifcReady = false;
async function initIFC(){
  ifcAPI.SetWasmPath("https://cdn.jsdelivr.net/npm/web-ifc@0.0.57/");
  await ifcAPI.Init();
  ifcReady = true;
}
initIFC();

document.getElementById('btnImport').onclick = ()=>document.getElementById('fileInput').click();
document.getElementById('fileInput').onchange = async e=>{
  const file = e.target.files[0]; if(!file) return;
  await loadIFC(file);
  e.target.value='';
};

function showLoader(txt){ document.getElementById('loadTxt').textContent=txt||'Procesando…'; document.getElementById('loader').style.display='flex'; }
function hideLoader(){ document.getElementById('loader').style.display='none'; }

async function loadIFC(file){
  if(!ifcReady){ showLoader('Inicializando motor IFC…'); while(!ifcReady) await new Promise(r=>setTimeout(r,100)); }
  showLoader('Leyendo '+file.name+'…');
  await new Promise(r=>setTimeout(r,30));

  // limpiar modelo anterior
  clearModel();

  const buffer = new Uint8Array(await file.arrayBuffer());
  const modelID = ifcAPI.OpenModel(buffer, {COORDINATE_TO_ORIGIN:true});

  showLoader('Construyendo geometría 3D…');
  await new Promise(r=>setTimeout(r,30));

  let count=0;
  ifcAPI.StreamAllMeshes(modelID,(flatMesh)=>{
    const expressID = flatMesh.expressID;
    const geoms = flatMesh.geometries;
    const meshes=[];
    for(let i=0;i<geoms.size();i++){
      const pg = geoms.get(i);
      const geom = ifcAPI.GetGeometry(modelID, pg.geometryExpressID);
      const verts = ifcAPI.GetVertexArray(geom.GetVertexData(), geom.GetVertexDataSize());
      const idx = ifcAPI.GetIndexArray(geom.GetIndexData(), geom.GetIndexDataSize());
      const bg = ifcBufferGeometry(verts, idx);
      const c = pg.color;
      const mat = new THREE.MeshLambertMaterial({
        color:new THREE.Color(c.x,c.y,c.z),
        transparent: c.w<1, opacity:c.w,
        side:THREE.DoubleSide
      });
      const mesh = new THREE.Mesh(bg, mat);
      const m = new THREE.Matrix4(); m.fromArray(pg.flatTransformation);
      mesh.applyMatrix4(m);
      mesh.userData.expressID = expressID;
      modelRoot.add(mesh);
      meshes.push(mesh);
      geom.delete();
    }
    if(meshes.length){
      const base = meshes[0].material.color.clone();
      Elements.set(expressID,{meshes, baseColor:base, centroid:null, name:null, type:null});
      count++;
    }
  });

  // metadatos (nombre/tipo)
  showLoader('Leyendo propiedades…');
  await new Promise(r=>setTimeout(r,10));
  for(const [id,e] of Elements){
    try{
      const line = ifcAPI.GetLine(modelID, id);
      e.name = (line.Name && line.Name.value) ? line.Name.value : ('#'+id);
      e.type = ifcTypeName(line.type);
    }catch(_){ e.name='#'+id; e.type='Elemento'; }
  }

  ifcAPI.CloseModel(modelID);

  // centroides en espacio mundo
  modelRoot.updateMatrixWorld(true);
  for(const [id,e] of Elements){
    const box = new THREE.Box3();
    for(const mesh of e.meshes){
      mesh.geometry.computeBoundingBox();
      const b = mesh.geometry.boundingBox.clone().applyMatrix4(mesh.matrixWorld);
      box.union(b);
    }
    e.centroid = box.getCenter(new THREE.Vector3());
  }

  hideLoader();
  document.getElementById('hEls').textContent = count;
  document.getElementById('hHint').textContent = count? 'Activa ▭ Selección y arrastra una caja para seleccionar. Luego "Asignar a actividad".' : 'No se encontró geometría.';
  fitView();
  applyElementColors();
}

function ifcTypeName(code){
  try{
    // web-ifc no expone siempre el nombre; usamos mapa mínimo por prefijo si falla.
    const n = ifcAPI.GetNameFromTypeCode ? ifcAPI.GetNameFromTypeCode(code) : null;
    return n || 'IFC('+code+')';
  }catch(_){ return 'Elemento'; }
}

function ifcBufferGeometry(vertexData, indexData){
  const g = new THREE.BufferGeometry();
  const n = vertexData.length/2;
  const pos = new Float32Array(n);
  const nor = new Float32Array(n);
  for(let i=0;i<vertexData.length;i+=6){
    const k=i/2;
    pos[k]=vertexData[i]; pos[k+1]=vertexData[i+1]; pos[k+2]=vertexData[i+2];
    nor[k]=vertexData[i+3]; nor[k+1]=vertexData[i+4]; nor[k+2]=vertexData[i+5];
  }
  g.setAttribute('position', new THREE.BufferAttribute(pos,3));
  g.setAttribute('normal', new THREE.BufferAttribute(nor,3));
  g.setIndex(new THREE.BufferAttribute(new Uint32Array(indexData),1));
  return g;
}

function clearModel(){
  for(const [id,e] of Elements){
    for(const mesh of e.meshes){
      modelRoot.remove(mesh);
      mesh.geometry.dispose(); mesh.material.dispose();
    }
  }
  Elements.clear();
  State.selectedElements.clear();
  updateSelUI();
}

function fitView(){
  if(Elements.size===0) return;
  const box = new THREE.Box3().setFromObject(modelRoot);
  const size = box.getSize(new THREE.Vector3());
  const center = box.getCenter(new THREE.Vector3());
  const maxDim = Math.max(size.x,size.y,size.z)||10;
  controls.target.copy(center);
  camera.position.set(center.x+maxDim*1.1, center.y+maxDim*0.9, center.z+maxDim*1.1);
  camera.near = maxDim/1000; camera.far = maxDim*100; camera.updateProjectionMatrix();
  grid.position.set(center.x, box.min.y, center.z);
}
document.getElementById('btnFit').onclick = fitView;

/* ============================================================= *
 *  SELECCIÓN POR CAJA (RUBBER BAND)  — arrastre sostenido
 * ============================================================= */
const rubber = document.getElementById('rubber');
let dragging=false, dragStart={x:0,y:0}, dragAdd=false;

document.getElementById('btnSelect').onclick = function(){
  State.selectMode = !State.selectMode;
  this.classList.toggle('active', State.selectMode);
  controls.enabled = !State.selectMode;
  renderer.domElement.style.cursor = State.selectMode? 'crosshair':'default';
};

renderer.domElement.addEventListener('pointerdown', e=>{
  if(!State.selectMode || e.button!==0) return;
  dragging=true; dragAdd = e.shiftKey;
  const r = renderer.domElement.getBoundingClientRect();
  dragStart={x:e.clientX-r.left, y:e.clientY-r.top};
  rubber.style.display='block';
  updateRubber(dragStart.x,dragStart.y,0,0);
});
window.addEventListener('pointermove', e=>{
  if(!dragging) return;
  const r = renderer.domElement.getBoundingClientRect();
  const x=e.clientX-r.left, y=e.clientY-r.top;
  const rx=Math.min(x,dragStart.x), ry=Math.min(y,dragStart.y);
  updateRubber(rx,ry,Math.abs(x-dragStart.x),Math.abs(y-dragStart.y));
});
window.addEventListener('pointerup', e=>{
  if(!dragging) return;
  dragging=false; rubber.style.display='none';
  const r = renderer.domElement.getBoundingClientRect();
  const x=e.clientX-r.left, y=e.clientY-r.top;
  const x1=Math.min(x,dragStart.x), y1=Math.min(y,dragStart.y);
  const x2=Math.max(x,dragStart.x), y2=Math.max(y,dragStart.y);
  if(Math.abs(x2-x1)<4 && Math.abs(y2-y1)<4){ pickSingle(x,y,dragAdd); }
  else boxSelect(x1,y1,x2,y2,dragAdd);
});
function updateRubber(x,y,w,h){
  const vp = viewport.getBoundingClientRect(); const cv = renderer.domElement.getBoundingClientRect();
  const offx = cv.left-vp.left, offy = cv.top-vp.top;
  rubber.style.left=(x+offx)+'px'; rubber.style.top=(y+offy)+'px';
  rubber.style.width=w+'px'; rubber.style.height=h+'px';
}
function boxSelect(x1,y1,x2,y2,add){
  if(!add) State.selectedElements.clear();
  const r = renderer.domElement.getBoundingClientRect();
  for(const [id,e] of Elements){
    if(!e.centroid) continue;
    const v = e.centroid.clone().project(camera);
    if(v.z>1) continue;
    const sx=(v.x*0.5+0.5)*r.width, sy=(-v.y*0.5+0.5)*r.height;
    if(sx>=x1&&sx<=x2&&sy>=y1&&sy<=y2) State.selectedElements.add(id);
  }
  updateSelUI(); applyElementColors();
}
const raycaster = new THREE.Raycaster();
function pickSingle(x,y,add){
  const r = renderer.domElement.getBoundingClientRect();
  const ndc = new THREE.Vector2((x/r.width)*2-1, -(y/r.height)*2+1);
  raycaster.setFromCamera(ndc,camera);
  const hits = raycaster.intersectObjects(modelRoot.children,false);
  if(!add) State.selectedElements.clear();
  if(hits.length){
    const id = hits[0].object.userData.expressID;
    if(id!=null){ if(State.selectedElements.has(id)&&add) State.selectedElements.delete(id); else State.selectedElements.add(id); }
  }
  updateSelUI(); applyElementColors();
}

document.getElementById('btnClearSel').onclick = ()=>{ State.selectedElements.clear(); updateSelUI(); applyElementColors(); };

function updateSelUI(){
  const n = State.selectedElements.size;
  document.getElementById('hSel').textContent=n;
  document.getElementById('abCount').textContent=n;
  const ab = document.getElementById('assignBar');
  ab.style.display = n>0 ? 'flex':'none';
  const t = getTask(State.selectedTaskId);
  document.getElementById('abTask').textContent = t? t.name : '(elige una actividad)';
  document.getElementById('btnAssign').disabled = !(n>0 && t);
}

/* ============================================================= *
 *  AISLAR
 * ============================================================= */
let isolated=false;
document.getElementById('btnIsolate').onclick = ()=>{
  isolated=!isolated;
  if(isolated && State.selectedElements.size){
    for(const [id,e] of Elements){
      const vis = State.selectedElements.has(id);
      e.meshes.forEach(m=>m.visible=vis);
    }
  }else{
    isolated=false;
    for(const [id,e] of Elements) e.meshes.forEach(m=>m.visible=true);
  }
};

/* ============================================================= *
 *  COLOREADO DE ELEMENTOS (por actividad / selección / 4D)
 * ============================================================= */
const GHOST = new THREE.Color(0x3a4250);
function taskOfElement(id){
  for(const t of State.tasks) if(t.elements.includes(id)) return t;
  return null;
}
function applyElementColors(){
  if(State.mode4D){ apply4DColors(); return; }
  for(const [id,e] of Elements){
    const mesh0 = e.meshes;
    let col, opacity=1, transparent=false;
    if(State.selectedElements.has(id)){ col=new THREE.Color(0xffffff); }
    else{
      const t = taskOfElement(id);
      if(t) col=new THREE.Color(t.color);
      else { col=GHOST; opacity=0.55; transparent=true; }
    }
    mesh0.forEach(m=>{
      m.material.color.copy(col);
      m.material.opacity = State.selectedElements.has(id)?1:opacity;
      m.material.transparent = State.selectedElements.has(id)?false:transparent;
      m.material.emissive = State.selectedElements.has(id)? new THREE.Color(0x333333):new THREE.Color(0x000000);
    });
  }
}

const tableWrap = document.getElementById('tableWrap');

function getTask(id){ return State.tasks.find(t=>t.id===id); }
function taskIndex(id){ return State.tasks.findIndex(t=>t.id===id); }
function isSummary(i){
  const t=State.tasks[i]; const n=State.tasks[i+1];
  return n && n.level>t.level;
}
function newTask(level){
  return {id:State.seq++, name:'Nueva actividad', level:level||0, duration:1,
          ps:'', pf:'', as:'', af:'', pred:'', elements:[], color:PALETTE[(State.seq)%PALETTE.length], collapsed:false,
          es:null, ef:null, ls:null, lf:null, slack:null, critical:false};
}

function addTask(sub){
  const idx = taskIndex(State.selectedTaskId);
  let level=0, insertAt=State.tasks.length;
  if(idx>=0){ level = State.tasks[idx].level + (sub?1:0); insertAt=idx+1;
    // saltar descendientes para insertar tras el bloque
    if(!sub){ insertAt=idx+1; while(insertAt<State.tasks.length && State.tasks[insertAt].level>State.tasks[idx].level) insertAt++; }
  }
  const t=newTask(level);
  State.tasks.splice(insertAt,0,t);
  State.selectedTaskId=t.id;
  renderTable(); focusName(t.id);
}
document.getElementById('tAdd').onclick=()=>addTask(false);
document.getElementById('tSub').onclick=()=>addTask(true);

document.getElementById('tIndent').onclick=()=>changeIndent(1);
document.getElementById('tOutdent').onclick=()=>changeIndent(-1);
function changeIndent(d){
  const idx=taskIndex(State.selectedTaskId); if(idx<=0 && d>0) { if(idx<0) return; }
  if(idx<0) return;
  const t=State.tasks[idx];
  if(d>0){ // no puede indentar más que nivel del anterior+1
    if(idx===0) return;
    if(t.level > State.tasks[idx-1].level) return;
  }
  if(d<0 && t.level===0) return;
  const oldLevel=t.level; t.level=Math.max(0,t.level+d);
  // mover descendientes
  for(let j=idx+1;j<State.tasks.length && State.tasks[j].level>oldLevel;j++) State.tasks[j].level+=d;
  renderTable();
}

document.getElementById('tUp').onclick=()=>moveBlock(-1);
document.getElementById('tDown').onclick=()=>moveBlock(1);
function moveBlock(dir){
  const idx=taskIndex(State.selectedTaskId); if(idx<0) return;
  const t=State.tasks[idx];
  // bloque = tarea + descendientes
  let end=idx+1; while(end<State.tasks.length && State.tasks[end].level>t.level) end++;
  const block=State.tasks.slice(idx,end);
  if(dir<0){
    if(idx===0) return;
    // insertar antes del bloque hermano anterior
    let prev=idx-1; const pl=State.tasks[prev].level;
    let pstart=prev; while(pstart>0 && State.tasks[pstart-1].level>State.tasks[prev].level) pstart--;
    State.tasks.splice(idx,block.length);
    State.tasks.splice(pstart,0,...block);
  }else{
    if(end>=State.tasks.length) return;
    let nl=State.tasks[end].level; let nend=end+1;
    while(nend<State.tasks.length && State.tasks[nend].level>State.tasks[end].level) nend++;
    const nextBlock=State.tasks.slice(end,nend);
    State.tasks.splice(idx,block.length+nextBlock.length,...nextBlock,...block);
  }
  renderTable();
}

document.getElementById('tDel').onclick=()=>{
  const idx=taskIndex(State.selectedTaskId); if(idx<0) return;
  const t=State.tasks[idx];
  let end=idx+1; while(end<State.tasks.length && State.tasks[end].level>t.level) end++;
  State.tasks.splice(idx,end-idx);
  State.selectedTaskId = State.tasks.length? State.tasks[Math.min(idx,State.tasks.length-1)].id : null;
  renderTable(); applyElementColors();
};

function focusName(id){
  requestAnimationFrame(()=>{ const el=document.querySelector(`input.nameinput[data-id="${id}"]`); if(el){el.focus();el.select();} });
}

function fmt(d){ return d||''; }

function renderTable(){
  if(State.tasks.length===0){
    tableWrap.innerHTML = '<div class="empty">No hay actividades.<br>Pulsa <b>＋ Actividad</b> o <b>Ejemplo</b> para empezar.<br><br>Usa <b>Sangría/Anular</b> para crear la jerarquía EDT como en MS&nbsp;Project.</div>';
    return;
  }
  const rows = State.tasks.map((t,i)=>{
    const summ = isSummary(i);
    const sel = t.id===State.selectedTaskId?'sel':'';
    const scls = summ?'summary':'';
    const crit = t.critical?'critical':'';
    const twist = summ ? `<span class="twist" data-tw="${t.id}">${t.collapsed?'▸':'▾'}</span>` : '<span class="twist"></span>';
    const indent = `<span class="indent" style="width:${t.level*18}px"></span>`;
    const swatch = summ?'' : `<span class="swatch" style="background:${t.color}"></span>`;
    const elc = summ?'' : `<span class="elcount" data-el="${t.id}" title="Ver/gestionar elementos asignados">${t.elements.length}⬚</span>`;
    const critBadge = t.critical? '<span class="cbadge">CRÍTICA</span>':'';
    // ocultar si un ancestro está colapsado
    if(isHidden(i)) return '';
    return `<tr class="${scls} ${sel} ${crit}" data-row="${t.id}">
      <td class="idcell">${i+1}</td>
      <td class="namecell"><div class="cell">${indent}${twist}${swatch}
        <input class="nameinput" data-id="${t.id}" value="${escapeHtml(t.name)}" style="font-weight:${summ?700:400}"></div></td>
      <td><input type="number" min="0" step="0.5" data-f="duration" data-id="${t.id}" value="${summ?rollupDur(i):t.duration}" ${summ?'disabled':''}></td>
      <td><input type="date" data-f="ps" data-id="${t.id}" value="${fmt(t.ps)}"></td>
      <td><input type="date" data-f="pf" data-id="${t.id}" value="${fmt(t.pf)}"></td>
      <td><input type="date" data-f="as" data-id="${t.id}" value="${fmt(t.as)}"></td>
      <td><input type="date" data-f="af" data-id="${t.id}" value="${fmt(t.af)}"></td>
      <td><input type="text" data-f="pred" data-id="${t.id}" value="${escapeHtml(t.pred)}" placeholder="ej: 3,4" style="width:60px" ${summ?'disabled':''}></td>
      <td class="critcell">${critBadge}${elc}</td>
    </tr>`;
  }).join('');
  tableWrap.innerHTML = `<table class="sched">
    <thead><tr>
      <th>#</th><th>Nombre de actividad (EDT)</th><th>Dur (d)</th>
      <th>Inicio Plan.</th><th>Fin Plan.</th><th>Inicio Real</th><th>Fin Real</th><th>Pred.</th><th>Estado</th>
    </tr></thead><tbody>${rows}</tbody></table>`;
  bindTable();
  updateSelUI();
}

function isHidden(idx){
  // oculta si cualquier ancestro directo en la cadena está colapsado
  const t=State.tasks[idx];
  let needLevel=t.level-1;
  for(let j=idx-1;j>=0 && needLevel>=0;j--){
    if(State.tasks[j].level===needLevel){
      if(State.tasks[j].collapsed) return true;
      needLevel--;
    }
  }
  return false;
}

function rollupDur(i){
  // duración de resumen = span de fechas hijos o suma simple
  const t=State.tasks[i]; let end=i+1; let sum=0;
  for(let j=i+1;j<State.tasks.length && State.tasks[j].level>t.level;j++){
    if(!isSummary(j)) sum+=Number(State.tasks[j].duration)||0;
  }
  return sum;
}

function escapeHtml(s){ return (s||'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c])); }

function bindTable(){
  tableWrap.querySelectorAll('tr[data-row]').forEach(tr=>{
    tr.addEventListener('mousedown',e=>{
      if(e.target.tagName==='INPUT'||e.target.classList.contains('twist')||e.target.classList.contains('elcount')) {}
      State.selectedTaskId = Number(tr.dataset.row);
      tableWrap.querySelectorAll('tr').forEach(r=>r.classList.remove('sel'));
      tr.classList.add('sel'); updateSelUI();
      highlightTaskElements();
    });
  });
  tableWrap.querySelectorAll('.nameinput').forEach(inp=>{
    inp.addEventListener('input',e=>{ getTask(Number(inp.dataset.id)).name=inp.value; updateSelUI(); });
    inp.addEventListener('keydown',e=>{
      if(e.key==='Tab'){ e.preventDefault(); State.selectedTaskId=Number(inp.dataset.id); changeIndent(e.shiftKey?-1:1); }
      if(e.key==='Enter'){ e.preventDefault(); State.selectedTaskId=Number(inp.dataset.id); addTask(false); }
    });
  });
  tableWrap.querySelectorAll('input[data-f]').forEach(inp=>{
    inp.addEventListener('change',e=>{
      const t=getTask(Number(inp.dataset.id)); const f=inp.dataset.f;
      t[f]= f==='duration'? Number(inp.value)||0 : inp.value;
    });
  });
  tableWrap.querySelectorAll('.twist[data-tw]').forEach(tw=>{
    tw.addEventListener('click',e=>{ e.stopPropagation(); const t=getTask(Number(tw.dataset.tw)); t.collapsed=!t.collapsed; renderTable(); });
  });
  tableWrap.querySelectorAll('.elcount[data-el]').forEach(b=>{
    b.addEventListener('click',e=>{ e.stopPropagation(); openElementModal(Number(b.dataset.el)); });
  });
}

function highlightTaskElements(){
  // resalta en 3D los elementos de la tarea seleccionada (sin borrar selección de asignación)
  applyElementColors();
  const t=getTask(State.selectedTaskId);
  if(t && t.elements.length){
    for(const id of t.elements){ const e=Elements.get(id); if(e) e.meshes.forEach(m=>{m.material.emissive=new THREE.Color(0x223344);}); }
  }
}

function assignSelected(){
  const t=getTask(State.selectedTaskId);
  if(!t || State.selectedElements.size===0) return;
  // quitar de otras tareas para evitar duplicados
  for(const id of State.selectedElements){
    for(const other of State.tasks){ const k=other.elements.indexOf(id); if(k>=0) other.elements.splice(k,1); }
    if(!t.elements.includes(id)) t.elements.push(id);

  State.selectedElements.clear();
  updateSelUI(); renderTable(); applyElementColors();

/* ============================================================= *
 *  CPM  — RUTA CRÍTICA
 * ============================================================= */
function leafTasks(){ return State.tasks.filter((t,i)=>!isSummary(i)); }

function calcCPM(){
  const leaves = leafTasks();
  if(leaves.length===0){ alert('Agrega actividades primero.'); return; }
  const byNum = new Map();            // número de fila (1-based) -> tarea
  State.tasks.forEach((t,i)=>byNum.set(i+1,t));
  const isLeaf = new Set(leaves.map(t=>t.id));

  // dependencias: pred = lista de números de fila (Finish-to-Start)
  const preds = new Map(); // taskId -> [taskId...]
  for(const t of leaves){
    const list=[];
    (t.pred||'').split(/[,;]/).map(s=>s.trim()).filter(Boolean).forEach(p=>{
      const num=parseInt(p,10); const pt=byNum.get(num);
      if(pt && pt.id!==t.id && isLeaf.has(pt.id)) list.push(pt.id);
    });
    preds.set(t.id,list);
  }
  const succ = new Map(); leaves.forEach(t=>succ.set(t.id,[]));
  for(const t of leaves) for(const p of preds.get(t.id)) succ.get(p).push(t.id);

  // orden topológico
  const indeg=new Map(); leaves.forEach(t=>indeg.set(t.id,preds.get(t.id).length));
  const queue=leaves.filter(t=>indeg.get(t.id)===0).map(t=>t.id);
  const order=[];
  while(queue.length){ const id=queue.shift(); order.push(id);
    for(const s of succ.get(id)){ indeg.set(s,indeg.get(s)-1); if(indeg.get(s)===0) queue.push(s); } }
  if(order.length<leaves.length){ alert('⚠ Hay dependencias circulares. Revisa la columna Pred.'); }

  const T=new Map(leaves.map(t=>[t.id,t]));
  // forward pass
  for(const id of order){ const t=T.get(id); const ps=preds.get(id);
    t.es = ps.length? Math.max(...ps.map(p=>T.get(p).ef)) : 0;
    t.ef = t.es + (Number(t.duration)||0);
  }
  const projEnd = Math.max(0,...leaves.map(t=>t.ef||0));
  // backward pass
  for(let i=order.length-1;i>=0;i--){ const id=order[i]; const t=T.get(id); const ss=succ.get(id);
    t.lf = ss.length? Math.min(...ss.map(s=>T.get(s).ls)) : projEnd;
    t.ls = t.lf - (Number(t.duration)||0);
    t.slack = t.ls - t.es;
    t.critical = Math.abs(t.slack) < 1e-6;
  }

  // fechas planificadas desde inicio de proyecto (días calendario)
  const startStr=document.getElementById('projStart').value;
  if(startStr){
    const base=new Date(startStr+'T00:00:00');
    for(const t of leaves){
      t.ps = addDays(base,t.es);
      t.pf = addDays(base, Math.max(t.es, t.ef - (t.duration>0?0:0)) ); // fin = es+dur
      t.pf = addDays(base, t.ef); // fin planificado (día siguiente al último de trabajo)
    }
  }
  // resúmenes: crítica si algún hijo lo es; fechas = span
  State.tasks.forEach((t,i)=>{
    if(isSummary(i)){
      let cs=null,ce=null,crit=false;
      for(let j=i+1;j<State.tasks.length && State.tasks[j].level>t.level;j++){
        const c=State.tasks[j]; if(isSummary(j)) continue;
        if(c.critical) crit=true;
        if(c.ps){ const d=new Date(c.ps); if(!cs||d<cs)cs=d; }
        if(c.pf){ const d=new Date(c.pf); if(!ce||d>ce)ce=d; }
      }
      t.critical=crit;
      if(cs) t.ps=cs.toISOString().slice(0,10);
      if(ce) t.pf=ce.toISOString().slice(0,10);
    }
  });

  renderTable(); applyElementColors(); setupTimeline();
  const critCount = leaves.filter(t=>t.critical).length;
  document.getElementById('hHint').textContent = `CPM: duración total ${projEnd} días · ${critCount} actividades críticas (en rojo).`;
}
document.getElementById('btnCPM').onclick=calcCPM;

function addDays(base,days){ const d=new Date(base); d.setDate(d.getDate()+days); return d.toISOString().slice(0,10); }

/* ============================================================= *
 *  SIMULACIÓN 4D
 * ============================================================= */
let playing=false, playTimer=null;
const timeline=document.getElementById('timeline');
let tlMin=null,tlMax=null;

function setupTimeline(){
  let min=null,max=null;
  for(const t of State.tasks){
    for(const k of ['ps','pf','as','af']){ if(t[k]){ const d=new Date(t[k]); if(!min||d<min)min=d; if(!max||d>max)max=d; } }
  }
  if(!min||!max){ return; }
  tlMin=min; tlMax=max;
  const days=Math.max(1,Math.round((max-min)/86400000));
  document.getElementById('timeSlider').max=days;
}

document.getElementById('btn4D').onclick=()=>{
  State.mode4D=!State.mode4D;
  document.getElementById('btn4D').classList.toggle('active',State.mode4D);
  timeline.classList.toggle('hidden',!State.mode4D);
  if(State.mode4D){ setupTimeline(); if(!tlMin){ alert('Calcula el CPM o define fechas planificadas primero.'); State.mode4D=false; document.getElementById('btn4D').classList.remove('active'); timeline.classList.add('hidden'); return;} update4D(0); }
  else { stopPlay(); applyElementColors(); }
};
document.getElementById('tlClose').onclick=()=>document.getElementById('btn4D').click();

const slider=document.getElementById('timeSlider');
slider.addEventListener('input',()=>update4D(Number(slider.value)));

function currentDate(dayOffset){ const d=new Date(tlMin); d.setDate(d.getDate()+dayOffset); return d; }
function update4D(dayOffset){
  const cur=currentDate(dayOffset);
  document.getElementById('tlDate').textContent = cur.toISOString().slice(0,10);
  let done=0,prog=0,pend=0;
  const stat={};
  for(const [id,e] of Elements){
    const t=taskOfElement(id);
    if(!t || !t.ps){ e.meshes.forEach(m=>{m.material.color.copy(GHOST);m.material.transparent=true;m.material.opacity=0.15;m.visible=true;}); continue; }
    const s=new Date(t.ps), f=new Date(t.pf||t.ps);
    let col,op=1,tr=false,vis=true;
    if(cur<s){ vis=true;col=GHOST;op=0.08;tr=true;pend++; }
    else if(cur>=s && cur<f){ col=new THREE.Color(0xf59e0b);prog++; } // en ejecución
    else { col=new THREE.Color(t.color);done++; } // completado
    e.meshes.forEach(m=>{m.material.color.copy(col);m.material.transparent=tr;m.material.opacity=op;m.material.emissive=new THREE.Color(0x000000);m.visible=vis;});
  }
  document.getElementById('tlInfo').textContent=`✔ ${done}  ⧗ ${prog}  ○ ${pend}`;
}
function stopPlay(){ playing=false; clearInterval(playTimer); document.getElementById('tlPlay').textContent='▶'; }
document.getElementById('tlPlay').onclick=()=>{
  if(playing){ stopPlay(); return; }
  playing=true; document.getElementById('tlPlay').textContent='⏸';
  playTimer=setInterval(()=>{
    let v=Number(slider.value); if(v>=Number(slider.max)){ stopPlay(); return; }
    v++; slider.value=v; update4D(v);
  },220);
};
