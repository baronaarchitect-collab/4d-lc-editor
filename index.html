<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>4D LC Editor — BIM 4D</title>
<style>
  :root{
    --bg:#0e1116; --panel:#161b22; --panel2:#1c2230; --line:#2b3444;
    --txt:#e6edf3; --muted:#8b98a9; --accent:#3b82f6; --accent2:#22c55e;
    --crit:#ef4444; --warn:#f59e0b; --row:#0f1420; --rowsel:#1d3a5f;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;height:100%;font-family:"Segoe UI",Roboto,Arial,sans-serif;background:var(--bg);color:var(--txt);overflow:hidden;font-size:13px;}
  body{display:flex;flex-direction:column;}
  button{font-family:inherit;font-size:12px;background:var(--panel2);color:var(--txt);border:1px solid var(--line);border-radius:6px;padding:6px 10px;cursor:pointer;display:inline-flex;align-items:center;gap:5px;}
  button:hover{border-color:var(--accent);background:#232c3d;}
  button:disabled{opacity:.4;cursor:not-allowed;}
  button.active{background:var(--accent);border-color:var(--accent);color:#fff;}
  input,select{font-family:inherit;background:#0c1017;color:var(--txt);border:1px solid var(--line);border-radius:4px;padding:3px 5px;font-size:12px;}
  input:focus,select:focus{outline:none;border-color:var(--accent);}
  #top{height:46px;display:flex;align-items:center;gap:8px;padding:0 12px;background:var(--panel);border-bottom:1px solid var(--line);flex-shrink:0;}
  #top .logo{font-weight:700;letter-spacing:.5px;color:var(--accent);margin-right:6px;}
  #top .logo b{color:var(--accent2);}
  .sep{width:1px;height:26px;background:var(--line);margin:0 4px;}
  .spacer{flex:1;}
  #main{display:flex;flex:1;min-height:0;}
  #left{width:640px;min-width:360px;background:var(--panel);border-right:1px solid var(--line);display:flex;flex-direction:column;flex-shrink:0;}
  #dragbar{width:5px;cursor:col-resize;background:var(--line);flex-shrink:0;}
  #dragbar:hover{background:var(--accent);}
  #right{flex:1;position:relative;min-width:0;}
  #viewport{position:absolute;inset:0;}
  canvas{display:block;}

  /* schedule */
  #schedToolbar{display:flex;flex-wrap:wrap;gap:5px;padding:8px;border-bottom:1px solid var(--line);align-items:center;}
  #schedToolbar button{padding:5px 8px;}
  #tableWrap{flex:1;overflow:auto;}
  table.sched{border-collapse:collapse;width:100%;font-size:12px;white-space:nowrap;}
  table.sched th{position:sticky;top:0;background:var(--panel2);border:1px solid var(--line);padding:5px 6px;font-weight:600;color:var(--muted);text-align:left;z-index:2;}
  table.sched td{border:1px solid var(--line);padding:0;}
  table.sched tr{background:var(--row);}
  table.sched tr.sel{background:var(--rowsel);}
  table.sched tr.summary{font-weight:700;background:#121a26;}
  table.sched tr.critical td.namecell{border-left:3px solid var(--crit);}
  table.sched td .cell{padding:4px 6px;min-height:24px;display:flex;align-items:center;gap:4px;}
  table.sched td input{width:100%;border:none;background:transparent;padding:4px 5px;}
  table.sched td input[type=date]{width:120px;color-scheme:dark;}
  table.sched td input[type=number]{width:60px;}
  .nameinput{font-weight:inherit;}
  .indent{display:inline-block;}
  .twist{color:var(--muted);width:12px;display:inline-block;cursor:pointer;user-select:none;}
  .cbadge{font-size:10px;padding:1px 5px;border-radius:8px;background:var(--crit);color:#fff;}
  .swatch{width:11px;height:11px;border-radius:2px;flex-shrink:0;border:1px solid rgba(255,255,255,.25);}
  .elcount{font-size:10px;color:var(--muted);background:#0c1017;border:1px solid var(--line);border-radius:8px;padding:0 5px;cursor:pointer;}
  .elcount:hover{border-color:var(--accent);color:var(--txt);}
  .idcell{color:var(--muted);text-align:center;width:34px;}
  .critcell{text-align:center;}

  /* overlays */
  #rubber{position:absolute;border:1.5px dashed var(--accent);background:rgba(59,130,246,.12);pointer-events:none;display:none;z-index:10;}
  #hud{position:absolute;left:10px;top:10px;background:rgba(12,16,23,.82);border:1px solid var(--line);border-radius:8px;padding:8px 11px;font-size:12px;pointer-events:none;max-width:340px;line-height:1.5;}
  #hud b{color:var(--accent2);}
  #assignBar{position:absolute;left:50%;transform:translateX(-50%);top:10px;background:rgba(20,26,38,.95);border:1px solid var(--accent);border-radius:10px;padding:8px 12px;display:none;align-items:center;gap:10px;z-index:11;box-shadow:0 6px 24px rgba(0,0,0,.5);}
  #assignBar b{color:var(--accent);}
  #loader{position:absolute;inset:0;background:rgba(8,10,14,.85);display:none;align-items:center;justify-content:center;flex-direction:column;gap:14px;z-index:30;}
  #loader .spin{width:42px;height:42px;border:4px solid var(--line);border-top-color:var(--accent);border-radius:50%;animation:sp 1s linear infinite;}
  @keyframes sp{to{transform:rotate(360deg);}}

  /* timeline */
  #timeline{position:absolute;left:12px;right:12px;bottom:12px;background:rgba(18,23,32,.95);border:1px solid var(--line);border-radius:10px;padding:10px 14px;display:flex;align-items:center;gap:12px;z-index:9;}
  #timeline .date{font-weight:700;color:var(--accent2);min-width:110px;}
  #timeSlider{flex:1;}
  #timeline.hidden{display:none;}

  /* ===== GANTT ===== */
  #gantt{flex-shrink:0;height:300px;background:var(--panel);border-top:1px solid var(--line);display:flex;flex-direction:column;}
  #gantt.collapsed{height:34px;}
  #ganttHead{height:34px;flex-shrink:0;display:flex;align-items:center;gap:12px;padding:0 12px;border-bottom:1px solid var(--line);}
  #ganttHead .gtitle{font-weight:700;cursor:pointer;user-select:none;display:flex;align-items:center;gap:6px;color:var(--accent);}
  #ganttHead .gtitle:hover{color:#fff;}
  #gantt.collapsed #ganttBody{display:none;}
  #ganttHead label{display:flex;align-items:center;gap:5px;}
  #ganttBody{flex:1;overflow:auto;}
  .gchart{position:relative;font-size:11px;}
  .ghead-row{position:sticky;top:0;z-index:5;display:flex;height:26px;background:var(--panel2);border-bottom:1px solid var(--line);}
  .grow{display:flex;height:26px;border-bottom:1px solid #161d29;}
  .grow:hover{background:#131a26;}
  .grow.selg{background:var(--rowsel);}
  .glabel{position:sticky;left:0;z-index:4;width:250px;min-width:250px;background:var(--panel);display:flex;align-items:center;gap:3px;padding:0 8px;border-right:1px solid var(--line);white-space:nowrap;overflow:hidden;cursor:pointer;}
  .grow.selg .glabel{background:var(--rowsel);}
  .ghead-row .glabel{background:var(--panel2);color:var(--muted);font-weight:600;}
  .gtw{width:12px;color:var(--muted);cursor:pointer;flex-shrink:0;text-align:center;}
  .gtrack,.gticks{position:relative;flex:1;}
  .gbar{position:absolute;top:5px;height:15px;border-radius:3px;background:var(--accent);cursor:grab;box-shadow:0 1px 2px rgba(0,0,0,.45);}
  .gbar:active{cursor:grabbing;}
  .gbar.crit{background:var(--crit);}
  .gbar.summ{background:#64748b;height:8px;top:9px;border-radius:2px;}
  .gbar.summ::before,.gbar.summ::after{content:"";position:absolute;bottom:-3px;width:0;height:0;border-left:4px solid transparent;border-right:4px solid transparent;border-top:5px solid #64748b;}
  .gbar.summ::before{left:0;} .gbar.summ::after{right:0;}
  .gbar.actual{background:transparent;border:1.5px solid var(--accent2);top:3px;height:19px;border-radius:3px;pointer-events:none;}
  .grow.drop{background:rgba(59,130,246,.18);outline:1px dashed var(--accent);outline-offset:-2px;}
  .gtick{position:absolute;top:0;bottom:0;border-left:1px solid #202836;color:var(--muted);font-size:9px;padding-left:2px;line-height:26px;}
  .gtick.month{border-left:1px solid #3a4658;color:var(--txt);font-weight:600;}
  .gtoday{position:absolute;top:26px;bottom:0;width:2px;background:var(--warn);z-index:2;pointer-events:none;}

  .hint{color:var(--muted);font-size:11px;}
  .empty{padding:30px;color:var(--muted);text-align:center;line-height:1.7;}
  ::-webkit-scrollbar{width:10px;height:10px;}
  ::-webkit-scrollbar-thumb{background:#2b3444;border-radius:5px;}
  ::-webkit-scrollbar-track{background:transparent;}

  /* modal element list */
  #modal{position:fixed;inset:0;background:rgba(0,0,0,.6);display:none;align-items:center;justify-content:center;z-index:50;}
  #modal .box{background:var(--panel);border:1px solid var(--line);border-radius:12px;width:520px;max-height:70vh;display:flex;flex-direction:column;}
  #modal .hd{padding:12px 16px;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;align-items:center;font-weight:600;}
  #modal .bd{overflow:auto;padding:8px 0;}
  #modal .el{padding:6px 16px;display:flex;justify-content:space-between;gap:8px;border-bottom:1px solid #1a212c;}
  #modal .el:hover{background:var(--panel2);}
  #modal .el small{color:var(--muted);}
</style>
</head>
<body>

<div id="top">
  <span class="logo">4D&nbsp;<b>LC</b>&nbsp;Editor</span>
  <button id="btnImport">📂 Importar IFC</button>
  <input type="file" id="fileInput" accept=".ifc" style="display:none">
  <div class="sep"></div>
  <button id="btnSelect" title="Modo selección: arrastra una caja sobre el modelo">▭ Selección</button>
  <button id="btnAssign" disabled title="Asignar elementos seleccionados a la actividad activa">🔗 Asignar a actividad</button>
  <button id="btnClearSel" title="Limpiar selección">✖ Limpiar</button>
  <button id="btnIsolate" title="Aislar / mostrar todo">👁 Aislar</button>
  <div class="sep"></div>
  <button id="btnCPM" title="Calcular ruta crítica (CPM)">⚡ Calcular CPM</button>
  <label class="hint">Inicio proyecto <input type="date" id="projStart"></label>
  <div class="spacer"></div>
  <button id="btn4D" title="Simulación 4D">▶ Simulación 4D</button>
  <button id="btnFit" title="Encuadrar">⤢ Encuadrar</button>
</div>

<div id="main">
  <div id="left">
    <div id="schedToolbar">
      <button id="tAdd" title="Nueva actividad">＋ Actividad</button>
      <button id="tSub" title="Nueva subactividad">＋ Sub</button>
      <div class="sep"></div>
      <button id="tIndent" title="Aumentar sangría (Tab)">⇥ Sangría</button>
      <button id="tOutdent" title="Disminuir sangría (Shift+Tab)">⇤ Anular</button>
      <div class="sep"></div>
      <button id="tUp" title="Subir">▲</button>
      <button id="tDown" title="Bajar">▼</button>
      <button id="tDel" title="Eliminar">🗑</button>
      <select id="wbsMode" title="Cómo agrupar la EDT generada desde el IFC">
        <option value="type">Categoría › Tipo</option>
        <option value="level-cat">Nivel › Categoría › Tipo</option>
        <option value="level-type">Nivel › Tipo</option>
        <option value="level">Solo Nivel</option>
      </select>
      <button id="tWBS" title="Generar EDT desde el IFC con la agrupación elegida">🏗 EDT⇐IFC</button>
      <div class="spacer"></div>
      <button id="tDemo" title="Cargar cronograma de ejemplo">Ejemplo</button>
    </div>
    <div id="tableWrap"></div>
  </div>
  <div id="dragbar"></div>
  <div id="right">
    <div id="viewport"></div>
    <div id="rubber"></div>
    <div id="hud">
      <div>Elementos: <b id="hEls">0</b> · Seleccionados: <b id="hSel">0</b></div>
      <div class="hint" id="hHint">Importa un IFC para empezar.</div>
    </div>
    <div id="assignBar">
      <span><b id="abCount">0</b> elementos seleccionados</span>
      <span class="hint">→ actividad:</span>
      <b id="abTask">—</b>
      <button id="abAssign">Asignar</button>
    </div>
    <div id="timeline" class="hidden">
      <button id="tlPlay">▶</button>
      <span class="date" id="tlDate">—</span>
      <input type="range" id="timeSlider" min="0" max="100" value="0">
      <span class="hint" id="tlInfo"></span>
      <button id="tlClose">✖</button>
    </div>
    <div id="loader"><div class="spin"></div><div id="loadTxt">Procesando IFC…</div></div>
  </div>
</div>

<div id="gantt" class="collapsed">
  <div id="ganttHead">
    <span class="gtitle" id="ganttToggle">▸ Diagrama de Gantt</span>
    <span class="hint">Arrastra una barra sobre otra actividad para hacerla su <b>predecesora</b>. Los resúmenes se colapsan con ▾/▸.</span>
    <div class="spacer"></div>
    <label class="hint">Zoom <input type="range" id="ganttZoom" min="6" max="46" value="20" style="width:120px"></label>
  </div>
  <div id="ganttBody"></div>
</div>

<div id="modal"><div class="box">
  <div class="hd"><span id="mTitle">Elementos</span><button id="mClose">Cerrar</button></div>
  <div class="bd" id="mBody"></div>
</div></div>

<script type="importmap">
{
  "imports": {
    "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
    "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/",
    "web-ifc": "https://cdn.jsdelivr.net/npm/web-ifc@0.0.57/web-ifc-api.js"
  }
}
</script>

<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
import * as WebIFC from 'web-ifc';
const { IfcAPI } = WebIFC;

// mapa código-de-tipo -> nombre de clase IFC (IFCWALL, IFCSLAB, ...)
const IFC_CODE2NAME = {};
for(const k in WebIFC){ if(typeof WebIFC[k]==='number' && /^IFC[A-Z0-9]+$/.test(k)) IFC_CODE2NAME[WebIFC[k]] = k; }

/* ============================================================= *
 *  ESTADO GLOBAL
 * ============================================================= */
const State = {
  tasks: [],            // {id,name,level,duration,ps,pf,as,af,pred,elements[],color,collapsed}
  seq: 1,
  selectedTaskId: null,
  selectedElements: new Set(),   // expressIDs seleccionados en 3D
  mode4D: false,
  selectMode: false,
};

const PALETTE = ['#3b82f6','#22c55e','#f59e0b','#ef4444','#a855f7','#06b6d4','#ec4899','#84cc16','#f97316','#14b8a6','#eab308','#8b5cf6'];

/* ============================================================= *
 *  THREE.JS  ESCENA
 * ============================================================= */
const viewport = document.getElementById('viewport');
const renderer = new THREE.WebGLRenderer({antialias:true});
renderer.setPixelRatio(Math.min(window.devicePixelRatio,2));
renderer.setSize(viewport.clientWidth, viewport.clientHeight);
viewport.appendChild(renderer.domElement);

const scene = new THREE.Scene();
scene.background = new THREE.Color(0x0e1116);

const camera = new THREE.PerspectiveCamera(55, viewport.clientWidth/viewport.clientHeight, 0.1, 100000);
camera.position.set(30,30,30);

const controls = new OrbitControls(camera, renderer.domElement);
controls.enableDamping = true;
controls.dampingFactor = 0.08;

scene.add(new THREE.AmbientLight(0xffffff,0.75));
const dir = new THREE.DirectionalLight(0xffffff,0.9); dir.position.set(50,80,40); scene.add(dir);
const dir2 = new THREE.DirectionalLight(0xffffff,0.4); dir2.position.set(-40,20,-30); scene.add(dir2);
const grid = new THREE.GridHelper(200,40,0x334155,0x1e293b); scene.add(grid);

// grupo raíz del modelo (Z-up -> Y-up)
const modelRoot = new THREE.Group();
modelRoot.rotation.x = -Math.PI/2;
scene.add(modelRoot);

// registro de elementos: expressID -> {meshes:[], baseColor:THREE.Color, centroid:Vector3, name, type}
const Elements = new Map();

function animate(){
  requestAnimationFrame(animate);
  controls.update();
  renderer.render(scene,camera);
}
animate();

window.addEventListener('resize', onResize);
function onResize(){
  const w = viewport.clientWidth, h = viewport.clientHeight;
  renderer.setSize(w,h);
  camera.aspect = w/h; camera.updateProjectionMatrix();
}

/* ============================================================= *
 *  IFC  IMPORT
 * ============================================================= */
const ifcAPI = new IfcAPI();
let ifcReady = false;
async function initIFC(){
  ifcAPI.SetWasmPath("https://cdn.jsdelivr.net/npm/web-ifc@0.0.57/");
  await ifcAPI.Init();
  ifcReady = true;
}
initIFC();

document.getElementById('btnImport').onclick = ()=>document.getElementById('fileInput').click();
document.getElementById('fileInput').onchange = async e=>{
  const file = e.target.files[0]; if(!file) return;
  await loadIFC(file);
  e.target.value='';
};

function showLoader(txt){ document.getElementById('loadTxt').textContent=txt||'Procesando…'; document.getElementById('loader').style.display='flex'; }
function hideLoader(){ document.getElementById('loader').style.display='none'; }

async function loadIFC(file){
  if(!ifcReady){ showLoader('Inicializando motor IFC…'); while(!ifcReady) await new Promise(r=>setTimeout(r,100)); }
  showLoader('Leyendo '+file.name+'…');
  await new Promise(r=>setTimeout(r,30));

  // limpiar modelo anterior
  clearModel();

  const buffer = new Uint8Array(await file.arrayBuffer());
  const modelID = ifcAPI.OpenModel(buffer, {COORDINATE_TO_ORIGIN:true});

  showLoader('Construyendo geometría 3D…');
  await new Promise(r=>setTimeout(r,30));

  let count=0;
  ifcAPI.StreamAllMeshes(modelID,(flatMesh)=>{
    const expressID = flatMesh.expressID;
    const geoms = flatMesh.geometries;
    const meshes=[];
    for(let i=0;i<geoms.size();i++){
      const pg = geoms.get(i);
      const geom = ifcAPI.GetGeometry(modelID, pg.geometryExpressID);
      const verts = ifcAPI.GetVertexArray(geom.GetVertexData(), geom.GetVertexDataSize());
      const idx = ifcAPI.GetIndexArray(geom.GetIndexData(), geom.GetIndexDataSize());
      const bg = ifcBufferGeometry(verts, idx);
      const c = pg.color;
      const mat = new THREE.MeshLambertMaterial({
        color:new THREE.Color(c.x,c.y,c.z),
        transparent: c.w<1, opacity:c.w,
        side:THREE.DoubleSide
      });
      const mesh = new THREE.Mesh(bg, mat);
      const m = new THREE.Matrix4(); m.fromArray(pg.flatTransformation);
      mesh.applyMatrix4(m);
      mesh.userData.expressID = expressID;
      modelRoot.add(mesh);
      meshes.push(mesh);
      geom.delete();
    }
    if(meshes.length){
      const base = meshes[0].material.color.clone();
      Elements.set(expressID,{meshes, baseColor:base, centroid:null, name:null, type:null, category:null, typeName:null, objType:null, storey:null, storeyElev:null});
      count++;
    }
  });

  // metadatos (nombre / categoría IFC / ObjectType)
  showLoader('Leyendo propiedades…');
  await new Promise(r=>setTimeout(r,10));
  for(const [id,e] of Elements){
    try{
      const line = ifcAPI.GetLine(modelID, id);
      e.name = (line.Name && line.Name.value) ? line.Name.value : ('#'+id);
      e.category = ifcTypeName(line.type);
      e.type = e.category;
      e.objType = (line.ObjectType && line.ObjectType.value) ? line.ObjectType.value : null;
    }catch(_){ e.name='#'+id; e.type='Elemento'; e.category='Otros'; }
  }

  // TIPOS: relación IfcRelDefinesByType (elemento -> tipo)
  showLoader('Leyendo tipos…');
  try{
    const rels = ifcAPI.GetLineIDsWithType(modelID, WebIFC.IFCRELDEFINESBYTYPE);
    for(let i=0;i<rels.size();i++){
      const rel = ifcAPI.GetLine(modelID, rels.get(i));
      let tName = null;
      if(rel.RelatingType && rel.RelatingType.value){
        try{ const to = ifcAPI.GetLine(modelID, rel.RelatingType.value);
          tName = (to.Name && to.Name.value) ? to.Name.value : ifcTypeName(to.type); }catch(_){}
      }
      const objs = rel.RelatedObjects || [];
      for(const o of objs){ if(o && o.value!=null){ const e=Elements.get(o.value); if(e && tName) e.typeName=tName; } }
    }
  }catch(_){}
  for(const [id,e] of Elements){ if(!e.typeName) e.typeName = e.objType || '(sin tipo definido)'; }

  // NIVELES: relación IfcRelContainedInSpatialStructure (elemento -> planta/nivel)
  showLoader('Leyendo niveles…');
  const storeyElev = new Map();
  try{
    const relsC = ifcAPI.GetLineIDsWithType(modelID, WebIFC.IFCRELCONTAINEDINSPATIALSTRUCTURE);
    for(let i=0;i<relsC.size();i++){
      const rel = ifcAPI.GetLine(modelID, relsC.get(i));
      if(!rel.RelatingStructure || rel.RelatingStructure.value==null) continue;
      let sName=null, sElev=null;
      try{
        const st = ifcAPI.GetLine(modelID, rel.RelatingStructure.value);
        sName = (st.Name && st.Name.value) ? st.Name.value : ifcTypeName(st.type);
        if(st.Elevation && st.Elevation.value!=null) sElev = Number(st.Elevation.value);
      }catch(_){}
      if(sName!=null) storeyElev.set(sName, sElev);
      const objs = rel.RelatedElements || [];
      for(const o of objs){ if(o && o.value!=null){ const e=Elements.get(o.value); if(e){ e.storey=sName; e.storeyElev=sElev; } } }
    }
  }catch(_){}
  window.__storeyElev = storeyElev;   // usado por buildWBSFromIFC para ordenar por elevación

  ifcAPI.CloseModel(modelID);

  // centroides en espacio mundo
  modelRoot.updateMatrixWorld(true);
  for(const [id,e] of Elements){
    const box = new THREE.Box3();
    for(const mesh of e.meshes){
      mesh.geometry.computeBoundingBox();
      const b = mesh.geometry.boundingBox.clone().applyMatrix4(mesh.matrixWorld);
      box.union(b);
    }
    e.centroid = box.getCenter(new THREE.Vector3());
  }

  hideLoader();
  document.getElementById('hEls').textContent = count;
  fitView();

  // EDT automática desde categorías + tipos del IFC
  if(count>0){
    let doWBS = true;
    if(State.tasks.length>0) doWBS = confirm('¿Generar la EDT automáticamente a partir de las CATEGORÍAS y TIPOS del IFC?\n\n(Reemplazará el cronograma actual)');
    if(doWBS){
      buildWBSFromIFC(file.name);
      document.getElementById('hHint').textContent = 'EDT generada desde el IFC. Ajusta duraciones y pulsa ⚡ Calcular CPM.';
    } else {
      document.getElementById('hHint').textContent = 'Activa ▭ Selección, arrastra una caja y pulsa "Asignar a actividad".';
    }
  } else {
    document.getElementById('hHint').textContent = 'No se encontró geometría.';
  }
  applyElementColors();
}

function ifcTypeName(code){
  if(IFC_CODE2NAME[code]) return IFC_CODE2NAME[code];
  try{ const n = ifcAPI.GetNameFromTypeCode ? ifcAPI.GetNameFromTypeCode(code) : null; return n || 'IFC('+code+')'; }
  catch(_){ return 'IFC('+code+')'; }
}

/* Claves de agrupación disponibles */
function wbsKeys(mode){
  const kCat  = {fn:e=>prettyCat(e.category||'Otros')};
  const kType = {fn:e=>e.typeName||'(sin tipo definido)'};
  const storeyElev = window.__storeyElev || new Map();
  const kLevel= {fn:e=>e.storey||'Sin nivel',
                 cmp:(a,b)=>((storeyElev.get(a)??1e9)-(storeyElev.get(b)??1e9)) || String(a).localeCompare(String(b))};
  switch(mode){
    case 'level-cat':  return [kLevel, kCat, kType];   // Nivel › Categoría › Tipo
    case 'level-type': return [kLevel, kType];          // Nivel › Tipo
    case 'level':      return [kLevel];                 // solo Nivel
    case 'type':       return [kType];                  // solo Tipo
    default:           return [kCat, kType];            // Categoría › Tipo
  }
}

/* Construye la EDT recursivamente según las claves elegidas; el último nivel = hoja con elementos */
function buildWBSFromIFC(fileName){
  if(Elements.size===0){ alert('Primero importa un IFC.'); return; }
  const mode = (document.getElementById('wbsMode')||{}).value || 'type';
  const keys = wbsKeys(mode);
  const entries = [...Elements.entries()].map(([id,e])=>({id,e}));

  const tasks=[];
  const mk=(name,level)=>{ const t=newTask(level); t.name=name; return t; };
  const root=mk('📦 '+(fileName||'Modelo IFC'),0); tasks.push(root);

  (function rec(items, ki, level){
    const key=keys[ki];
    const groups=new Map();
    for(const it of items){ const k=key.fn(it.e)||'(sin dato)'; if(!groups.has(k))groups.set(k,[]); groups.get(k).push(it); }
    const orderedKeys=[...groups.keys()].sort(key.cmp || ((a,b)=>String(a).localeCompare(String(b))));
    for(const k of orderedKeys){
      const arr=groups.get(k);
      if(ki===keys.length-1){                          // hoja: actividad con elementos
        const leaf=mk(`${k}  (${arr.length})`, level);
        leaf.elements=arr.map(it=>it.id);
        leaf.duration=Math.max(1,Math.ceil(arr.length/5));
        tasks.push(leaf);
      }else{                                            // resumen
        tasks.push(mk(`${k}  ·  ${arr.length} elem.`, level));
        rec(arr, ki+1, level+1);
      }
    }
  })(entries, 0, 1);

  State.tasks=tasks;
  State.selectedTaskId=tasks[0]?tasks[0].id:null;
  if(!document.getElementById('projStart').value) document.getElementById('projStart').value=new Date().toISOString().slice(0,10);
  renderTable(); openGantt();
  document.getElementById('hHint').textContent=`EDT generada (${tasks.length-1} nodos) agrupando por: ${document.getElementById('wbsMode').selectedOptions[0].text}.`;
}
function prettyCat(c){
  // "IFCWALLSTANDARDCASE" -> "Ifc Wall Standard Case" (legible)
  if(/^IFC/.test(c)){ let s=c.slice(3).toLowerCase(); s=s.charAt(0).toUpperCase()+s.slice(1); return 'Ifc '+s.replace(/^\w/,x=>x.toUpperCase()); }
  return c;
}
document.getElementById('tWBS').onclick=()=>{
  if(Elements.size===0){ alert('Primero importa un IFC.'); return; }
  if(State.tasks.length>0 && !confirm('¿Regenerar la EDT desde el IFC? Reemplazará el cronograma actual.')) return;
  buildWBSFromIFC('Modelo IFC');
};

function ifcBufferGeometry(vertexData, indexData){
  const g = new THREE.BufferGeometry();
  const n = vertexData.length/2;
  const pos = new Float32Array(n);
  const nor = new Float32Array(n);
  for(let i=0;i<vertexData.length;i+=6){
    const k=i/2;
    pos[k]=vertexData[i]; pos[k+1]=vertexData[i+1]; pos[k+2]=vertexData[i+2];
    nor[k]=vertexData[i+3]; nor[k+1]=vertexData[i+4]; nor[k+2]=vertexData[i+5];
  }
  g.setAttribute('position', new THREE.BufferAttribute(pos,3));
  g.setAttribute('normal', new THREE.BufferAttribute(nor,3));
  g.setIndex(new THREE.BufferAttribute(new Uint32Array(indexData),1));
  return g;
}

const rubber = document.getElementById('rubber');
let dragging=false, dragStart={x:0,y:0}, dragAdd=false;

document.getElementById('btnSelect').onclick = function(){

renderer.domElement.addEventListener('pointerdown', e=>{
  if(!State.selectMode || e.button!==0) return;
  dragging=true; dragAdd = e.shiftKey;
  const r = renderer.domElement.getBoundingClientRect();
  dragStart={x:e.clientX-r.left, y:e.clientY-r.top};
  rubber.style.display='block';
  updateRubber(dragStart.x,dragStart.y,0,0);
});
window.addEventListener('pointermove', e=>{
  if(!dragging) return;
  const r = renderer.domElement.getBoundingClientRect();
  const x=e.clientX-r.left, y=e.clientY-r.top;
  const rx=Math.min(x,dragStart.x), ry=Math.min(y,dragStart.y);
  updateRubber(rx,ry,Math.abs(x-dragStart.x),Math.abs(y-dragStart.y));
});
window.addEventListener('pointerup', e=>{
  if(!dragging) return;
  dragging=false; rubber.style.display='none';
  const r = renderer.domElement.getBoundingClientRect();
  const x=e.clientX-r.left, y=e.clientY-r.top;
  const x1=Math.min(x,dragStart.x), y1=Math.min(y,dragStart.y);
  const x2=Math.max(x,dragStart.x), y2=Math.max(y,dragStart.y);
  if(Math.abs(x2-x1)<4 && Math.abs(y2-y1)<4){ pickSingle(x,y,dragAdd); }
  else boxSelect(x1,y1,x2,y2,dragAdd);
});
function updateRubber(x,y,w,h){
  const vp = viewport.getBoundingClientRect(); const cv = renderer.domElement.getBoundingClientRect();
  const offx = cv.left-vp.left, offy = cv.top-vp.top;
  rubber.style.left=(x+offx)+'px'; rubber.style.top=(y+offy)+'px';
  rubber.style.width=w+'px'; rubber.style.height=h+'px';
}
function boxSelect(x1,y1,x2,y2,add){
  if(!add) State.selectedElements.clear();
  const r = renderer.domElement.getBoundingClientRect();
  for(const [id,e] of Elements){
    if(!e.centroid) continue;
    const v = e.centroid.clone().project(camera);
    if(v.z>1) continue;
    const sx=(v.x*0.5+0.5)*r.width, sy=(-v.y*0.5+0.5)*r.height;
    if(sx>=x1&&sx<=x2&&sy>=y1&&sy<=y2) State.selectedElements.add(id);
  }
  updateSelUI(); applyElementColors();
}
const raycaster = new THREE.Raycaster();
function pickSingle(x,y,add){
  const r = renderer.domElement.getBoundingClientRect();
  const ndc = new THREE.Vector2((x/r.width)*2-1, -(y/r.height)*2+1);
  raycaster.setFromCamera(ndc,camera);
  const hits = raycaster.intersectObjects(modelRoot.children,false);
  if(!add) State.selectedElements.clear();
  if(hits.length){
    const id = hits[0].object.userData.expressID;
    if(id!=null){ if(State.selectedElements.has(id)&&add) State.selectedElements.delete(id); else State.selectedElements.add(id); }
  }
  updateSelUI(); applyElementColors();
}

function getTask(id){ return State.tasks.find(t=>t.id===id); }
function taskIndex(id){ return State.tasks.findIndex(t=>t.id===id); }
function isSummary(i){
  const t=State.tasks[i]; const n=State.tasks[i+1];
  return n && n.level>t.level;
}
function newTask(level){
  return {id:State.seq++, name:'Nueva actividad', level:level||0, duration:1,
          anchor:null, ps:'', pf:'', as:'', af:'', pred:'', elements:[], color:PALETTE[(State.seq)%PALETTE.length], collapsed:false,
          es:null, ef:null, ls:null, lf:null, slack:null, critical:false};
}

function addTask(sub){
  const idx = taskIndex(State.selectedTaskId);
  let level=0, insertAt=State.tasks.length;
  if(idx>=0){ level = State.tasks[idx].level + (sub?1:0); insertAt=idx+1;
    // saltar descendientes para insertar tras el bloque
    if(!sub){ insertAt=idx+1; while(insertAt<State.tasks.length && State.tasks[insertAt].level>State.tasks[idx].level) insertAt++; }
  }
  const t=newTask(level);
  State.tasks.splice(insertAt,0,t);
  State.selectedTaskId=t.id;
  renderTable(); focusName(t.id);
}

document.getElementById('tIndent').onclick=()=>changeIndent(1);
document.getElementById('tOutdent').onclick=()=>changeIndent(-1);
function changeIndent(d){
  const idx=taskIndex(State.selectedTaskId); if(idx<=0 && d>0) { if(idx<0) return; }
  if(idx<0) return;
  const t=State.tasks[idx];
  if(d>0){ // no puede indentar más que nivel del anterior+1
    if(idx===0) return;
    if(t.level > State.tasks[idx-1].level) return;
  }
  if(d<0 && t.level===0) return;
  const oldLevel=t.level; t.level=Math.max(0,t.level+d);
  // mover descendientes
  for(let j=idx+1;j<State.tasks.length && State.tasks[j].level>oldLevel;j++) State.tasks[j].level+=d;
  renderTable();
}

document.getElementById('tUp').onclick=()=>moveBlock(-1);
document.getElementById('tDown').onclick=()=>moveBlock(1);
function moveBlock(dir){
  const idx=taskIndex(State.selectedTaskId); if(idx<0) return;
  const t=State.tasks[idx];
  // bloque = tarea + descendientes
  let end=idx+1; while(end<State.tasks.length && State.tasks[end].level>t.level) end++;
  const block=State.tasks.slice(idx,end);
  if(dir<0){
    if(idx===0) return;
    // insertar antes del bloque hermano anterior
    let prev=idx-1; const pl=State.tasks[prev].level;
    let pstart=prev; while(pstart>0 && State.tasks[pstart-1].level>State.tasks[prev].level) pstart--;
    State.tasks.splice(idx,block.length);
    State.tasks.splice(pstart,0,...block);
  }else{
    if(end>=State.tasks.length) return;
    let nl=State.tasks[end].level; let nend=end+1;
    while(nend<State.tasks.length && State.tasks[nend].level>State.tasks[end].level) nend++;
    const nextBlock=State.tasks.slice(end,nend);
    State.tasks.splice(idx,block.length+nextBlock.length,...nextBlock,...block);
  }
  renderTable();
}

document.getElementById('tDel').onclick=()=>{
  const idx=taskIndex(State.selectedTaskId); if(idx<0) return;
  const t=State.tasks[idx];
  let end=idx+1; while(end<State.tasks.length && State.tasks[end].level>t.level) end++;
  State.tasks.splice(idx,end-idx);
  State.selectedTaskId = State.tasks.length? State.tasks[Math.min(idx,State.tasks.length-1)].id : null;
  renderTable(); applyElementColors();
};

function isHidden(idx){
  // oculta si cualquier ancestro directo en la cadena está colapsado
  const t=State.tasks[idx];
  let needLevel=t.level-1;
  for(let j=idx-1;j>=0 && needLevel>=0;j--){
    if(State.tasks[j].level===needLevel){
      if(State.tasks[j].collapsed) return true;
      needLevel--;
    }
  }
  return false;
}

function rollupDur(i){
  // duración de resumen = span de fechas hijos o suma simple
  const t=State.tasks[i]; let end=i+1; let sum=0;
  for(let j=i+1;j<State.tasks.length && State.tasks[j].level>t.level;j++){
    if(!isSummary(j)) sum+=Number(State.tasks[j].duration)||0;
  }
  return sum;
}

function escapeHtml(s){ return (s||'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c])); }

function bindTable(){
  tableWrap.querySelectorAll('tr[data-row]').forEach(tr=>{
    tr.addEventListener('mousedown',e=>{
      selectTask(Number(tr.dataset.row));

  tableWrap.querySelectorAll('.nameinput').forEach(inp=>{
    inp.addEventListener('input',e=>{ getTask(Number(inp.dataset.id)).name=inp.value; updateSelUI(); });
    inp.addEventListener('keydown',e=>{
      if(e.key==='Tab'){ e.preventDefault(); State.selectedTaskId=Number(inp.dataset.id); changeIndent(e.shiftKey?-1:1); }
      if(e.key==='Enter'){ e.preventDefault(); State.selectedTaskId=Number(inp.dataset.id); addTask(false); }
    });
  });
  tableWrap.querySelectorAll('input[data-f]').forEach(inp=>{
    inp.addEventListener('change',e=>{
      const t=getTask(Number(inp.dataset.id)); const f=inp.dataset.f; const v=inp.value;
      if(f==='duration'){ t.duration=Number(v)||0; calcCPM(); }            // mantiene inicio, recalcula fin
      else if(f==='ps'){ t.anchor = v||null; t.ps=v; calcCPM(); }          // fija el inicio (ancla)
      else if(f==='pf'){ if(t.ps && v){ t.duration=Math.max(0,Math.round((new Date(v+'T00:00:00')-new Date(t.ps+'T00:00:00'))/DAYMS)); } calcCPM(); }
      else if(f==='pred'){ t.pred=v; calcCPM(); }                          // dependencias Fin→Inicio
      else { t[f]=v; renderGantt(); }                                       // as / af (fechas reales)
    });
  });
  tableWrap.querySelectorAll('.twist[data-tw]').forEach(tw=>{
    tw.addEventListener('click',e=>{ e.stopPropagation(); const t=getTask(Number(tw.dataset.tw)); t.collapsed=!t.collapsed; renderTable(); });

function assignSelected(){
  const t=getTask(State.selectedTaskId);
  if(!t || State.selectedElements.size===0) return;
  // quitar de otras tareas para evitar duplicados
  for(const id of State.selectedElements){
    for(const other of State.tasks){ const k=other.elements.indexOf(id); if(k>=0) other.elements.splice(k,1); }
    if(!t.elements.includes(id)) t.elements.push(id);
  }
  State.selectedElements.clear();
  updateSelUI(); renderTable(); applyElementColors();
  document.getElementById('hHint').textContent = `Asignados a "${t.name}". Total: ${t.elements.length} elementos.`;
}
document.getElementById('btnAssign').onclick=assignSelected;
document.getElementById('abAssign').onclick=assignSelected;

function openElementModal(taskId){
  const t=getTask(taskId); if(!t) return;
  const body=document.getElementById('mBody');
  document.getElementById('mTitle').textContent=`${t.name} — ${t.elements.length} elementos`;
  if(t.elements.length===0){ body.innerHTML='<div class="empty">Sin elementos asignados.<br>Selecciona en 3D y pulsa Asignar.</div>'; }
  else body.innerHTML = t.elements.map(id=>{
    const e=Elements.get(id);
    return `<div class="el"><span>${e?escapeHtml(e.name):'#'+id} <small>${e?e.type:''}</small></span>
      <button data-rm="${id}">Quitar</button></div>`;
  }).join('');
  body.querySelectorAll('button[data-rm]').forEach(b=>{
    b.onclick=()=>{ const id=Number(b.dataset.rm); const k=t.elements.indexOf(id); if(k>=0)t.elements.splice(k,1); openElementModal(taskId); renderTable(); applyElementColors(); };
  });
  document.getElementById('modal').style.display='flex';
}
document.getElementById('mClose').onclick=()=>document.getElementById('modal').style.display='none';
document.getElementById('modal').addEventListener('click',e=>{ if(e.target.id==='modal') e.target.style.display='none'; });

/* ============================================================= *
 *  CPM  — RUTA CRÍTICA
 * ============================================================= */
function leafTasks(){ return State.tasks.filter((t,i)=>!isSummary(i)); }

function calcCPM(){
  const leaves = leafTasks();
  if(leaves.length===0){ alert('Agrega actividades primero.'); return; }
  const byNum = new Map();            // número de fila (1-based) -> tarea
  State.tasks.forEach((t,i)=>byNum.set(i+1,t));
  const isLeaf = new Set(leaves.map(t=>t.id));

  // dependencias: pred = lista de números de fila (Finish-to-Start)
  const preds = new Map(); // taskId -> [taskId...]
  for(const t of leaves){
    const list=[];
    (t.pred||'').split(/[,;]/).map(s=>s.trim()).filter(Boolean).forEach(p=>{
      const num=parseInt(p,10); const pt=byNum.get(num);
      if(pt && pt.id!==t.id && isLeaf.has(pt.id)) list.push(pt.id);
    });
    preds.set(t.id,list);
  }
  const succ = new Map(); leaves.forEach(t=>succ.set(t.id,[]));
  for(const t of leaves) for(const p of preds.get(t.id)) succ.get(p).push(t.id);

  // orden topológico
  const indeg=new Map(); leaves.forEach(t=>indeg.set(t.id,preds.get(t.id).length));
  const queue=leaves.filter(t=>indeg.get(t.id)===0).map(t=>t.id);
  const order=[];
  while(queue.length){ const id=queue.shift(); order.push(id);
    for(const s of succ.get(id)){ indeg.set(s,indeg.get(s)-1); if(indeg.get(s)===0) queue.push(s); } }
  if(order.length<leaves.length){ alert('⚠ Hay dependencias circulares. Revisa la columna Pred.'); }

  const T=new Map(leaves.map(t=>[t.id,t]));
  // base = inicio de proyecto (día 0 del espacio de cálculo)
  const projStartStr = document.getElementById('projStart').value || new Date().toISOString().slice(0,10);
  const base = new Date(projStartStr+'T00:00:00');
  const dayOf = (str)=> Math.round((new Date(str+'T00:00:00')-base)/DAYMS);
  // forward pass — respeta ANCLA de inicio (fecha manual) + relación Fin→Inicio
  for(const id of order){ const t=T.get(id); const ps=preds.get(id);
    let start = t.anchor ? dayOf(t.anchor) : 0;          // inicio deseado por el usuario (o ASAP)
    if(ps.length) start = Math.max(start, ...ps.map(p=>T.get(p).ef));  // empujado por predecesoras
    t.es = start;
    t.ef = t.es + (Number(t.duration)||0);
    t.ps = addDays(base, t.es);
    t.pf = addDays(base, t.ef);
  }
  const projEnd = Math.max(0,...leaves.map(t=>t.ef||0));
  // backward pass
  for(let i=order.length-1;i>=0;i--){ const id=order[i]; const t=T.get(id); const ss=succ.get(id);
    t.lf = ss.length? Math.min(...ss.map(s=>T.get(s).ls)) : projEnd;
    t.ls = t.lf - (Number(t.duration)||0);
    t.slack = t.ls - t.es;
    t.critical = Math.abs(t.slack) < 1e-6;
  }

  // resúmenes: crítica si algún hijo lo es; fechas = span
  State.tasks.forEach((t,i)=>{
    if(isSummary(i)){
      let cs=null,ce=null,crit=false;
      for(let j=i+1;j<State.tasks.length && State.tasks[j].level>t.level;j++){
        const c=State.tasks[j]; if(isSummary(j)) continue;
        if(c.critical) crit=true;
        if(c.ps){ const d=new Date(c.ps); if(!cs||d<cs)cs=d; }
        if(c.pf){ const d=new Date(c.pf); if(!ce||d>ce)ce=d; }
      }
      t.critical=crit;
      if(cs) t.ps=cs.toISOString().slice(0,10);
      if(ce) t.pf=ce.toISOString().slice(0,10);
    }
  });

  renderTable(); applyElementColors(); setupTimeline();
  const critCount = leaves.filter(t=>t.critical).length;
  document.getElementById('hHint').textContent = `CPM: duración total ${projEnd} días · ${critCount} actividades críticas (en rojo).`;
}
document.getElementById('btnCPM').onclick=calcCPM;

function addDays(base,days){ const d=new Date(base); d.setDate(d.getDate()+days); return d.toISOString().slice(0,10); }

/* ============================================================= *
 *  DIAGRAMA DE GANTT  (colapsable + arrastrar para crear dependencia)
 * ============================================================= */
let ganttOpen=false, ganttDayW=20;
const ganttEl=document.getElementById('gantt');
const DAYMS=86400000;

function toggleGantt(){
  ganttOpen=!ganttOpen;
  ganttEl.classList.toggle('collapsed',!ganttOpen);
  document.getElementById('ganttToggle').textContent = (ganttOpen?'▾':'▸')+' Diagrama de Gantt';
  if(ganttOpen) renderGantt();
  onResize();
}
document.getElementById('ganttToggle').onclick=toggleGantt;
document.getElementById('ganttZoom').addEventListener('input',e=>{ ganttDayW=Number(e.target.value); renderGantt(); });
function openGantt(){ if(!ganttOpen) toggleGantt(); else renderGantt(); }

function ganttRange(){
  let min=null,max=null;
  for(const t of State.tasks){
    for(const k of ['ps','pf','as','af']){ if(t[k]){ const d=new Date(t[k]+'T00:00:00'); if(!min||d<min)min=d; if(!max||d>max)max=d; } }
  }
  return {min,max};
}

function renderGantt(){
  if(!ganttOpen) return;
  const body=document.getElementById('ganttBody');
  if(State.tasks.length===0){ body.innerHTML='<div class="empty">Sin actividades.</div>'; return; }
  const {min,max}=ganttRange();
  if(!min||!max){ body.innerHTML='<div class="empty">Sin fechas todavía.<br>Pulsa <b>⚡ Calcular CPM</b> o escribe Inicio/Fin planificados en la tabla.</div>'; return; }

  const totalDays=Math.max(1,Math.round((max-min)/DAYMS))+2;
  const dw=ganttDayW, trackW=totalDays*dw;
  const dayIdx=(dstr)=>Math.round((new Date(dstr+'T00:00:00')-min)/DAYMS);

  // cabecera con marcas
  let ticks='';
  for(let i=0;i<=totalDays;i++){
    const d=new Date(min.getTime()+i*DAYMS);
    const month = d.getDate()===1, week = d.getDay()===1;
    if(month||week||dw>=24){
      const lbl = month ? d.toLocaleDateString('es',{month:'short',year:'2-digit'}) : (dw>=24? d.getDate() : '');
      ticks+=`<div class="gtick ${month?'month':''}" style="left:${i*dw}px">${lbl}</div>`;
    }
  }
  const today=new Date(); today.setHours(0,0,0,0);
  let todayLine='';
  if(today>=min && today<=max){ todayLine=`<div class="gtoday" style="left:${250+Math.round((today-min)/DAYMS)*dw}px"></div>`; }

  let rowsHtml='';
  State.tasks.forEach((t,i)=>{
    if(isHidden(i)) return;
    const summ=isSummary(i);
    const sel=t.id===State.selectedTaskId?'selg':'';
    const indent=`<span style="display:inline-block;width:${t.level*12}px;flex-shrink:0"></span>`;
    const tw = summ? `<span class="gtw" data-gtw="${t.id}">${t.collapsed?'▸':'▾'}</span>` : '<span class="gtw"></span>';
    let bar='';
    if(t.ps){
      const x=dayIdx(t.ps)*dw;
      const end=t.pf?dayIdx(t.pf):dayIdx(t.ps)+ (Number(t.duration)||1);
      const w=Math.max(dw*0.5,(end-dayIdx(t.ps))*dw);
      bar=`<div class="gbar ${summ?'summ':''} ${t.critical?'crit':''}" draggable="true" data-bar="${t.id}"
            style="left:${x}px;width:${w}px" title="${escapeHtml(t.name)}&#10;Plan: ${t.ps} → ${t.pf||'?'}${t.critical?'&#10;⚠ CRÍTICA':''}"></div>`;
    }
    let actual='';
    if(t.as){ const ax=dayIdx(t.as)*dw; const ae=t.af?dayIdx(t.af):dayIdx(t.as)+1; const aw=Math.max(dw*0.5,(ae-dayIdx(t.as))*dw);
      actual=`<div class="gbar actual" style="left:${ax}px;width:${aw}px" title="Real: ${t.as} → ${t.af||'?'}"></div>`; }
    rowsHtml+=`<div class="grow ${sel}" data-grow="${t.id}">
      <div class="glabel" data-lbl="${t.id}" style="font-weight:${summ?700:400}">${indent}${tw}<span class="gname">${escapeHtml(t.name)}</span></div>
      <div class="gtrack" style="min-width:${trackW}px">${bar}${actual}</div>
    </div>`;
  });

  body.innerHTML=`<div class="gchart" style="min-width:${250+trackW}px">
    <div class="ghead-row"><div class="glabel">Actividad</div><div class="gticks" style="min-width:${trackW}px">${ticks}</div></div>
    ${rowsHtml}${todayLine}
  </div>`;
  bindGantt();
}

function bindGantt(){
  const body=document.getElementById('ganttBody');
  body.querySelectorAll('.grow').forEach(row=>{
    const id=Number(row.dataset.grow);
    row.querySelector('.glabel').addEventListener('mousedown',e=>{
      if(e.target.classList.contains('gtw')) return;
      selectTask(id);
    });
    row.addEventListener('dragover',e=>{ e.preventDefault(); e.dataTransfer.dropEffect='link'; row.classList.add('drop'); });
    row.addEventListener('dragleave',()=>row.classList.remove('drop'));
    row.addEventListener('drop',e=>{
      e.preventDefault(); row.classList.remove('drop');
      const src=Number(e.dataTransfer.getData('text/plain'));
      linkPredecessor(src,id);
    });
  });
  body.querySelectorAll('.gtw[data-gtw]').forEach(tw=>{
    tw.addEventListener('click',e=>{ e.stopPropagation(); const t=getTask(Number(tw.dataset.gtw)); t.collapsed=!t.collapsed; renderTable(); });
  });
  body.querySelectorAll('.gbar[data-bar]').forEach(bar=>{
    bar.addEventListener('dragstart',e=>{ e.dataTransfer.setData('text/plain',bar.dataset.bar); e.dataTransfer.effectAllowed='link'; bar.style.opacity='.45'; });
    bar.addEventListener('dragend',()=>{ bar.style.opacity='1'; });
  });
}

/* arrastrar actividad ORIGEN sobre actividad DESTINO => origen es predecesora del destino */
function linkPredecessor(srcId,tgtId){
  if(!srcId||srcId===tgtId) return;
  const src=getTask(srcId), tgt=getTask(tgtId);
  if(!src||!tgt) return;
  const srcNum=taskIndex(srcId)+1;
  const list=(tgt.pred||'').split(/[,;]/).map(s=>s.trim()).filter(Boolean);
  if(list.includes(String(srcNum))){ document.getElementById('hHint').textContent=`"${src.name}" ya es predecesora de "${tgt.name}".`; return; }
  list.push(String(srcNum));
  tgt.pred=list.join(',');
  document.getElementById('hHint').textContent=`🔗 "${src.name}" → predecesora de "${tgt.name}". Recalculando CPM…`;
  calcCPM();
}

/* ============================================================= *
 *  SIMULACIÓN 4D
 * ============================================================= */
let playing=false, playTimer=null;
const timeline=document.getElementById('timeline');
let tlMin=null,tlMax=null;

function setupTimeline(){
  let min=null,max=null;
  for(const t of State.tasks){
    for(const k of ['ps','pf','as','af']){ if(t[k]){ const d=new Date(t[k]); if(!min||d<min)min=d; if(!max||d>max)max=d; } }
  }
  if(!min||!max){ return; }
  tlMin=min; tlMax=max;
  const days=Math.max(1,Math.round((max-min)/86400000));
  document.getElementById('timeSlider').max=days;
}

document.getElementById('btn4D').onclick=()=>{
  State.mode4D=!State.mode4D;
  document.getElementById('btn4D').classList.toggle('active',State.mode4D);
  timeline.classList.toggle('hidden',!State.mode4D);
  if(State.mode4D){ setupTimeline(); if(!tlMin){ alert('Calcula el CPM o define fechas planificadas primero.'); State.mode4D=false; document.getElementById('btn4D').classList.remove('active'); timeline.classList.add('hidden'); return;} update4D(0); }
  else { stopPlay(); applyElementColors(); }
};
document.getElementById('tlClose').onclick=()=>document.getElementById('btn4D').click();

const slider=document.getElementById('timeSlider');
slider.addEventListener('input',()=>update4D(Number(slider.value)));

function currentDate(dayOffset){ const d=new Date(tlMin); d.setDate(d.getDate()+dayOffset); return d; }
function update4D(dayOffset){
  const cur=currentDate(dayOffset);
  document.getElementById('tlDate').textContent = cur.toISOString().slice(0,10);
  let done=0,prog=0,pend=0;
  const stat={};
  for(const [id,e] of Elements){
    const t=taskOfElement(id);
    if(!t || !t.ps){ e.meshes.forEach(m=>{m.material.color.copy(GHOST);m.material.transparent=true;m.material.opacity=0.15;m.visible=true;}); continue; }
    const s=new Date(t.ps), f=new Date(t.pf||t.ps);
    let col,op=1,tr=false,vis=true;
    if(cur<s){ vis=true;col=GHOST;op=0.08;tr=true;pend++; }
    else if(cur>=s && cur<f){ col=new THREE.Color(0xf59e0b);prog++; } // en ejecución
    else { col=new THREE.Color(t.color);done++; } // completado
    e.meshes.forEach(m=>{m.material.color.copy(col);m.material.transparent=tr;m.material.opacity=op;m.material.emissive=new THREE.Color(0x000000);m.visible=vis;});
  }
  document.getElementById('tlInfo').textContent=`✔ ${done}  ⧗ ${prog}  ○ ${pend}`;
}
function stopPlay(){ playing=false; clearInterval(playTimer); document.getElementById('tlPlay').textContent='▶'; }
document.getElementById('tlPlay').onclick=()=>{
  if(playing){ stopPlay(); return; }
  playing=true; document.getElementById('tlPlay').textContent='⏸';
  playTimer=setInterval(()=>{
    let v=Number(slider.value); if(v>=Number(slider.max)){ stopPlay(); return; }
    v++; slider.value=v; update4D(v);
  },220);
};

 *  UTIL:  redimensionar panel izquierdo
 * ============================================================= */
const dragbar=document.getElementById('dragbar'); const left=document.getElementById('left');
let resizing=false;
dragbar.addEventListener('mousedown',()=>{resizing=true;document.body.style.cursor='col-resize';});
window.addEventListener('mousemove',e=>{ if(!resizing)return; const w=Math.max(360,Math.min(900,e.clientX)); left.style.width=w+'px'; onResize(); });

window.addEventListener('keydown',e=>{
  if(e.target.tagName==='INPUT') return;
  if(e.key==='Escape'){ State.selectedElements.clear(); updateSelUI(); applyElementColors(); }
  if(e.key==='a'&&(e.ctrlKey)){}
});

renderTable();
document.getElementById('projStart').value = new Date().toISOString().slice(0,10);
